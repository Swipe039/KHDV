<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Danh sách sinh viên</title>
</head>
<body>
  <h1>Danh sách sinh viên</h1>

  <table border="1" cellpadding="8" cellspacing="0">
    <thead>
      <tr>
        <th>Mã sinh viên</th>
        <th>Họ và tên</th>
      </tr>
    </thead>
    <tbody>
      {% for student in students %}
        <tr>
          <td>{{ student.student_code }}</td>
          <td>{{ student.full_name }}</td>
        </tr>
      {% empty %}
        <tr>
          <td colspan="2">Chưa có dữ liệu sinh viên.</td>
        </tr>
      {% endfor %}
    </tbody>
  </table>
</body>
</html>
